plugins {
    id 'java-library'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = "${project.archives_base_name}-core"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    api("org.xerial:sqlite-jdbc:${project.sqlite_version}")
    api("com.google.code.gson:gson:${project.gson_version}")
    compileOnly("org.slf4j:slf4j-api:${project.slf4j_version}")
    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly("org.slf4j:slf4j-nop:${project.slf4j_version}")
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
}

test {
    if (project.hasProperty('benchOperations')) {
        systemProperty 'exchange.bench.operations', project.property('benchOperations')
    }
    if (project.hasProperty('benchAuthorityThreads')) {
        systemProperty 'exchange.bench.authorityThreads', project.property('benchAuthorityThreads')
    }
    if (project.hasProperty('benchInFlight')) {
        systemProperty 'exchange.bench.inFlight', project.property('benchInFlight')
    }
    if (project.hasProperty('benchJfr')) {
        File recording = rootProject.file(project.property('benchJfr'))
        recording.parentFile.mkdirs()
        jvmArgs "-XX:StartFlightRecording=filename=${recording.absolutePath.replace('\\', '/')},settings=profile,dumponexit=true"
    }
    useJUnitPlatform {
        if (!project.hasProperty('bench')) {
            excludeTags 'bench'
        }
    }
}
